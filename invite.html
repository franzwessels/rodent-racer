<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LittleLegs Invite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D1117;
      color: #E6EDF3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #00BCD4;
    }
    p {
      color: #8B949E;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #00BCD4;
      color: #000;
    }
    .btn-secondary {
      background: transparent;
      color: #8B949E;
      border: 1px solid #30363D;
    }
    .status {
      font-size: 13px;
      color: #8B949E;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐾</div>
    <h1>You've been invited!</h1>
    <p>Someone shared their LittleLegs wheel with you. Open the app to start watching live stats.</p>
    <button class="btn btn-primary" id="openBtn">Open in LittleLegs</button>
    <a class="btn btn-secondary" id="downloadBtn" href="#" style="display:none">
      Download LittleLegs
    </a>
    <p class="status" id="status"></p>
  </div>
  <script>
    // ── Store URLs ──────────────────────────────────────────────
    const STORE_URLS = {
      ios: 'https://apps.apple.com/us/app/littlelegs/id6788909078',
      android: 'https://play.google.com/store/apps/details?id=app.littlelegs.runner'
    };

    // ── Platform detection ──────────────────────────────────────
    // Standard iPhone/iPod UA check, plus the iPadOS 13+ workaround:
    // modern iPads report as "Macintosh" in the UA string but expose
    // multi-touch, which a real Mac never does.
    function detectPlatform() {
      const ua = navigator.userAgent;
      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      if (isIOS) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'other';
    }

    const platform = detectPlatform();
    const storeUrl = STORE_URLS[platform] || STORE_URLS.android; // fallback

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const openBtn = document.getElementById('openBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    // Wire up the download link immediately based on the VISITOR's
    // platform — not the owner's, and not a hardcoded default.
    downloadBtn.href = storeUrl;

    if (!token) {
      status.textContent = 'Invalid invite link.';
      openBtn.disabled = true;
    }

    openBtn.addEventListener('click', () => {
      const deepLink = `littlelegs://invite/${token}`;
      status.textContent = 'Opening app...';
      window.location.href = deepLink;
      // If app doesn't open after 2 seconds, show download button
      setTimeout(() => {
        status.textContent = "App didn't open? Download it first.";
        downloadBtn.style.display = 'block';
      }, 2000);
    });

    // Auto-open on page load on mobile (both platforms now, not just Android)
    if ((platform === 'android' || platform === 'ios') && token) {
      setTimeout(() => {
        window.location.href = `littlelegs://invite/${token}`;
      }, 500);
    }
  </script>
</body>
</html>
